<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>前からこうでした — It's Always Been This Way</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0a;
        font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
        color: #e8e8e8;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
      }
      * {
        box-sizing: border-box;
      }

      /* 起動スプラッシュ: JSバンドルのDL・パース待ちの間、素のHTML/CSSだけで
         即座に描画される。React起動後、TitleScreen側でフェードアウト＆除去する。 */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #000;
        transition: opacity 0.4s ease;
      }
      #boot-splash img {
        width: min(38vw, 320px);
        height: auto;
        opacity: 0.92;
      }
      #boot-splash span {
        color: #444a54;
        font-size: 13px;
        letter-spacing: 0.4em;
        font-family: sans-serif;
        animation: boot-splash-pulse 1.6s ease-in-out infinite;
      }
      @keyframes boot-splash-pulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.85; }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <img src="/title/logo.webp" alt="前からこうでした" />
      <span>NOW LOADING</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
